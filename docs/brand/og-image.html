<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px;
    background: #0A0D12;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
    padding-left: 100px;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid #1A1F28;
  }
  .ring.r1 { width: 720px; height: 720px; right: -220px; top: -180px; }
  .ring.r2 { width: 560px; height: 560px; right: -140px; top: -100px; border-color: #232A35; }
  .ring.r3 { width: 400px; height: 400px; right: -60px; top: -20px; border-color: #2E3644; }
  .sweep {
    position: absolute;
    width: 720px; height: 720px;
    right: -220px; top: -180px;
    border-radius: 50%;
    background: conic-gradient(from 170deg, transparent 0deg, transparent 255deg, rgba(62,214,196,0.20) 300deg, rgba(62,214,196,0.5) 324deg, transparent 330deg);
  }
  .content { position: relative; z-index: 1; }
  .wordmark { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .mark {
    width: 64px; height: 64px;
    background: #3ED6C4;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark span {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 38px;
    color: #06201C;
  }
  .name {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 48px;
    color: #E4E8ED;
    letter-spacing: -0.01em;
  }
  h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 42px;
    color: #E4E8ED;
    letter-spacing: -0.02em;
    line-height: 1.2;
    max-width: 680px;
    margin-bottom: 22px;
  }
  h1 .pop { color: #3ED6C4; }
  .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 18px;
    color: #8791A0;
    max-width: 560px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="sweep"></div>
    <div class="content">
      <div class="wordmark">
        <div class="mark"><span>F</span></div>
        <div class="name">Farol</div>
      </div>
      <h1>Marketing e growth não cabem mais nas horas vagas. <span class="pop">Assuma isso direito.</span></h1>
      <div class="sub">Analytics, ads, posicionamento e estratégia de canal — pra founder early-stage sem time de marketing.</div>
    </div>
  </div>
</body>
</html>
