<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 512px; height: 512px;
    background: #0A0D12;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 512px; height: 512px;
    display: flex; align-items: center; justify-content: center;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid #1A1F28;
  }
  .ring.r1 { width: 460px; height: 460px; }
  .ring.r2 { width: 360px; height: 360px; border-color: #232A35; }
  .ring.r3 { width: 260px; height: 260px; border-color: #2E3644; }
  .sweep {
    position: absolute;
    width: 460px; height: 460px;
    border-radius: 50%;
    background: conic-gradient(from 220deg, transparent 0deg, transparent 250deg, rgba(62,214,196,0.22) 300deg, rgba(62,214,196,0.55) 328deg, transparent 330deg);
  }
  .blip {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #3ED6C4;
    box-shadow: 0 0 16px 4px rgba(62,214,196,0.7);
    top: 108px; right: 140px;
  }
  .mark {
    position: relative;
    width: 184px; height: 184px;
    background: #3ED6C4;
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 60px rgba(62,214,196,0.35);
  }
  .mark span {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 112px;
    color: #06201C;
    line-height: 1;
    transform: translateY(-4px);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="sweep"></div>
    <div class="blip"></div>
    <div class="mark"><span>F</span></div>
  </div>
</body>
</html>
